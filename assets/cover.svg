<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Utuseb Drinks and Delivery platform</title>
  <desc id="desc">A charcoal and copper presentation of the Utuseb customer storefront and mobile experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11100e"/><stop offset=".55" stop-color="#2b1d12"/><stop offset="1" stop-color="#543015"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e1903c" stop-opacity=".6"/><stop offset="1" stop-color="#e1903c" stop-opacity="0"/></radialGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f3eadf"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1375" cy="75" r="430" fill="url(#glow)"/>
  <circle cx="80" cy="880" r="370" fill="url(#glow)" opacity=".35"/>
  <g transform="translate(105 115)">
