    <path d="M18 14h18M20 19l4 21h6l4-21M23 28h8" fill="none" stroke="#18120c" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="27" fill="#fff8ef" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="5">UTUSEB</text>
    <text x="73" y="48" fill="#b8ada1" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3">DRINKS &amp; DELIVERY</text>
    <text y="160" fill="#e5a35f" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">PRODUCT CASE STUDY · 2026</text>
    <text y="235" fill="#fffaf2" font-family="Georgia,serif" font-size="84" font-weight="600">Private stock,</text>
    <text y="320" fill="#e59a4c" font-family="Georgia,serif" font-size="84" font-style="italic">now in your pocket.</text>
    <text y="380" fill="#bdb2a6" font-family="Arial,sans-serif" font-size="23">Mobile ordering, fulfilment and stock control</text>
    <text y="415" fill="#bdb2a6" font-family="Arial,sans-serif" font-size="23">built for a local Namibian drinks business.</text>
    <g transform="translate(0 490)">
      <rect width="174" height="54" rx="16" fill="#db8a35"/>
      <text x="87" y="34" text-anchor="middle" fill="#18120c" font-family="Arial,sans-serif" font-size="15" font-weight="800">LIVE PRODUCT</text>
      <text x="200" y="33" fill="#f6e6d3" font-family="Arial,sans-serif" font-size="16" font-weight="700">utuseb.pages.dev</text>
    </g>
  </g>
  <g transform="translate(870 92) rotate(3 290 350)" filter="url(#shadow)">
    <rect width="600" height="690" rx="28" fill="url(#cream)"/>
    <rect width="600" height="74" rx="28" fill="#171512"/><rect y="45" width="600" height="29" fill="#171512"/>
    <circle cx="41" cy="36" r="8" fill="#db8a35"/><text x="60" y="43" fill="#fff" font-family="Arial" font-size="16" font-weight="800" letter-spacing="2">UTUSEB</text>
    <rect x="455" y="19" width="112" height="36" rx="12" fill="#db8a35"/><text x="511" y="42" text-anchor="middle" fill="#18120c" font-family="Arial" font-size="13" font-weight="800">CART · 2</text>
