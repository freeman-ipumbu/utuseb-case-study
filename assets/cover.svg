    </g>
    <g transform="translate(32 426)">
      <g><rect width="164" height="218" rx="18" fill="#fff" stroke="#ded6ca"/><rect width="164" height="112" rx="18" fill="#e9bd79"/><rect y="94" width="164" height="18" fill="#e9bd79"/><text x="14" y="137" fill="#a46b30" font-family="Arial" font-size="9" font-weight="800">BEER</text><text x="14" y="160" fill="#211b15" font-family="Arial" font-size="15" font-weight="800">Tafel Lager</text><text x="14" y="180" fill="#8d847a" font-family="Arial" font-size="10">6 × 330ml</text><text x="14" y="207" fill="#211b15" font-family="Arial" font-size="16" font-weight="800">N$ 120</text><circle cx="140" cy="198" r="15" fill="#d98932"/><path d="M135 198h10M140 193v10" stroke="#17120c" stroke-width="2"/></g>
      <g transform="translate(180)"><rect width="164" height="218" rx="18" fill="#fff" stroke="#ded6ca"/><rect width="164" height="112" rx="18" fill="#a9c28b"/><rect y="94" width="164" height="18" fill="#a9c28b"/><text x="14" y="137" fill="#a46b30" font-family="Arial" font-size="9" font-weight="800">CIDER</text><text x="14" y="160" fill="#211b15" font-family="Arial" font-size="15" font-weight="800">Savanna Dry</text><text x="14" y="180" fill="#8d847a" font-family="Arial" font-size="10">6 × 330ml</text><text x="14" y="207" fill="#211b15" font-family="Arial" font-size="16" font-weight="800">N$ 132</text><circle cx="140" cy="198" r="15" fill="#d98932"/><path d="M135 198h10M140 193v10" stroke="#17120c" stroke-width="2"/></g>
      <g transform="translate(360)"><rect width="164" height="218" rx="18" fill="#fff" stroke="#ded6ca"/><rect width="164" height="112" rx="18" fill="#d5c16e"/><rect y="94" width="164" height="18" fill="#d5c16e"/><text x="14" y="137" fill="#a46b30" font-family="Arial" font-size="9" font-weight="800">CHAMPAGNE</text><text x="14" y="160" fill="#211b15" font-family="Arial" font-size="15" font-weight="800">JC Le Roux</text><text x="14" y="180" fill="#8d847a" font-family="Arial" font-size="10">750ml</text><text x="14" y="207" fill="#211b15" font-family="Arial" font-size="16" font-weight="800">N$ 135</text><circle cx="140" cy="198" r="15" fill="#d98932"/><path d="M135 198h10M140 193v10" stroke="#17120c" stroke-width="2"/></g>
    </g>
